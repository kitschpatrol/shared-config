name: Update Dependencies

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm ci

      - name: Run ksc-update
        uses: kitschpatrol/github-action-skill-to-pr@fe3e8b4aea5851133d8b064a68e92f7b7e4de1e4 # v1.1.1
        with:
          skill: ksc-update
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github-token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          instructions: |
            Note that this project has a complex monorepo configuration.
            You will also need to run the update-rules script in the
            packages/eslint-config package if the @kitschpatrol/eslint-config
            dependencies in that project change to regenerate types and update rules.
            Pay special attention to the eslint-config package in general, sometimes
            the generated presets in packages/eslint-config/src/presets need updates
            to their `// Begin expansion` template scripts.
            In prettier-config, prettier-plugin-svelte must remain on 3.5 since
            we have consuming projects that run on Svelte 4. Don't update any
            other packages that would break Svelte 4 compatibility.
          model: claude-opus-5-5
          effort: high
          max-turns: 400
