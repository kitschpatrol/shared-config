packages:
  - packages/*
ignoreWorkspaceRootCheck: true
publicHoistPattern:
  - '@kitschpatrol/repo-config'
  - '@kitschpatrol/typescript-config'
  - 'case-police'
  - '*cspell*'
  - '*eslint*'
  - '*knip*'
  - '*mdat*'
  - '*prettier*'
  - '*remark*'
  - '*stylelint*'
overrides:
  normalize-package-data: ^9.0.0
peerDependencyRules:
  allowedVersions:
    # No eslint 10 release yet, but runtime-compatible (used via eslint-plugin-astro)
    'eslint-plugin-jsx-a11y>eslint': '10'
allowBuilds:
  esbuild: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@pnpm/lockfile.fs@1100.2.12'
  - eslint-config-xo@5.0.0
  - eslint-cssicorn@0.1.0
  - eslint-node-test@1.0.1
  - eslint-package-json@2.0.0
  - eslint-plugin-n@18.4.1
  - eslint-plugin-unicorn@77.0.0
  - mdast-util-to-markdown@2.2.0
  - mdat@3.5.0
  - eslint-plugin-jsdoc@65.1.0
