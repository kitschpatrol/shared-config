allowBuilds:
  esbuild: true
  unrs-resolver: true
auditConfig:
  ignoreGhsas:
    # braces: stack-exhaustion DOS from deeply nested glob patterns, reached via
    # fast-glob > micromatch from shx, globby, and find-workspaces. No patched
    # release exists, and these only expand glob patterns from repo config and
    # package.json scripts, never untrusted input.
    - GHSA-vfj7-8cjw-p6xm
ignoreWorkspaceRootCheck: true
overrides:
  normalize-package-data: ^9.0.0
packages:
  - packages/*
peerDependencyRules:
  allowedVersions:
    # Remove once the installed version declares ESLint 10 support.
    # https://github.com/jsx-eslint/eslint-plugin-jsx-a11y/issues/1075
    # https://github.com/jsx-eslint/eslint-plugin-jsx-a11y/pull/1081
    eslint-plugin-jsx-a11y@6>eslint: ^10.0.0
publicHoistPattern:
  - '@kitschpatrol/repo-config'
  - '@kitschpatrol/typescript-config'
  - '*cspell*'
  - '*eslint*'
  - '*knip*'
  - '*mdat*'
  - '*prettier*'
  - '*remark*'
  - '*stylelint*'
  - 'case-police'
