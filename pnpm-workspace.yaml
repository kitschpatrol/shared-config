packages:
  - packages/*
ignoreWorkspaceRootCheck: true
publicHoistPattern:
  - '@kitschpatrol/repo-config'
  - '@kitschpatrol/typescript-config'
  - 'case-police'
  - '*cspell*'
  - '*eslint*'
  - '*knip*'
  - '*mdat*'
  - '*prettier*'
  - '*remark*'
  - '*stylelint*'
overrides:
  normalize-package-data: ^9.0.0
peerDependencyRules:
  allowedVersions:
    # No eslint 10 release yet, but runtime-compatible (used via eslint-plugin-astro)
    'eslint-plugin-jsx-a11y>eslint': '10'
allowBuilds:
  esbuild: true
  oxc-resolver: true
  puppeteer: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@e18e/eslint-plugin@0.6.0'
  - '@es-joy/jsdoccomment@0.90.0'
  - '@kitschpatrol/*'
  - '@pnpm/*'
  - '@types/react@19.2.18'
  - '@vitest/eslint-plugin@1.6.24'
  - eslint-plugin-jsdoc@63.2.2
  - eslint-plugin-svelte@3.22.0
  - execa
  - fs-extra@11.4.0
  - jsdoc-type-pratt-parser@7.3.0
  - mdat
  - mdat-plugin-cli-help
  - metascope
  - prettier
  - remark-mdat
  - spdx-license-list@6.12.0
