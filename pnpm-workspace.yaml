packages:
  - packages/*

ignoreWorkspaceRootCheck: true

publicHoistPattern:
  - '@kitschpatrol/repo-config'
  - '@kitschpatrol/typescript-config'
  - 'case-police'
  - '*cspell*'
  - '*eslint*'
  - '*knip*'
  - '*mdat*'
  - '*prettier*'
  - '*remark*'
  - '*stylelint*'

overrides:
  normalize-package-data: ^8.0.0
allowBuilds:
  esbuild: true
  oxc-resolver: true
  puppeteer: true
  unrs-resolver: true
  rollup: false
