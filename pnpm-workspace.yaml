allowBuilds:
  esbuild: true
  unrs-resolver: true
ignoreWorkspaceRootCheck: true
minimumReleaseAgeExclude:
  - '@eslint-react/ast@5.24.5'
  - '@eslint-react/core@5.24.5'
  - '@eslint-react/eslint-plugin@5.24.5'
  - '@eslint-react/eslint@5.24.5'
  - '@eslint-react/jsx@5.24.5'
  - '@eslint-react/shared@5.24.5'
  - '@eslint-react/var@5.24.5'
  - '@typescript-eslint/eslint-plugin@8.71.1'
  - '@typescript-eslint/parser@8.71.1'
  - '@typescript-eslint/project-service@8.71.1'
  - '@typescript-eslint/scope-manager@8.71.1'
  - '@typescript-eslint/tsconfig-utils@8.71.1'
  - '@typescript-eslint/type-utils@8.71.1'
  - '@typescript-eslint/types@8.71.1'
  - '@typescript-eslint/typescript-estree@8.71.1'
  - '@typescript-eslint/utils@8.71.1'
  - '@typescript-eslint/visitor-keys@8.71.1'
  - eslint-plugin-react-dom@5.24.5
  - eslint-plugin-react-jsx@5.24.5
  - eslint-plugin-react-naming-convention@5.24.5
  - eslint-plugin-react-rsc@5.24.5
  - eslint-plugin-react-web-api@5.24.5
  - eslint-plugin-react-x@5.24.5
overrides:
  normalize-package-data: ^9.0.0
packages:
  - packages/*
peerDependencyRules:
  allowedVersions:
    # No eslint 10 release yet, but runtime-compatible (used via eslint-plugin-astro)
    'eslint-plugin-jsx-a11y>eslint': '10'
publicHoistPattern:
  - '@kitschpatrol/repo-config'
  - '@kitschpatrol/typescript-config'
  - 'case-police'
  - '*cspell*'
  - '*eslint*'
  - '*knip*'
  - '*mdat*'
  - '*prettier*'
  - '*remark*'
  - '*stylelint*'
