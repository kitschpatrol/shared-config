packages:
  - packages/*
ignoreWorkspaceRootCheck: true
publicHoistPattern:
  - '@kitschpatrol/repo-config'
  - '@kitschpatrol/typescript-config'
  - 'case-police'
  - '*cspell*'
  - '*eslint*'
  - '*knip*'
  - '*mdat*'
  - '*prettier*'
  - '*remark*'
  - '*stylelint*'
overrides:
  normalize-package-data: ^9.0.0
peerDependencyRules:
  allowedVersions:
    # No eslint 10 release yet, but runtime-compatible (used via eslint-plugin-astro)
    'eslint-plugin-jsx-a11y>eslint': '10'
minimumReleaseAgeExclude:
  - '@cspell/cspell-bundled-dicts@10.3.5'
  - '@cspell/cspell-json-reporter@10.3.5'
  - '@cspell/cspell-performance-monitor@10.3.5'
  - '@cspell/cspell-pipe@10.3.5'
  - '@cspell/cspell-resolver@10.3.5'
  - '@cspell/cspell-service-bus@10.3.5'
  - '@cspell/cspell-types@10.3.5'
  - '@cspell/cspell-worker@10.3.5'
  - '@cspell/dynamic-import@10.3.5'
  - '@cspell/filetypes@10.3.5'
  - '@cspell/rpc@10.3.5'
  - '@cspell/strong-weak-map@10.3.5'
  - '@cspell/url@10.3.5'
  - '@eslint-react/ast@5.21.1'
  - '@eslint-react/core@5.21.1'
  - '@eslint-react/eslint-plugin@5.21.1'
  - '@eslint-react/eslint@5.21.1'
  - '@eslint-react/jsx@5.21.1'
  - '@eslint-react/shared@5.21.1'
  - '@eslint-react/var@5.21.1'
  - '@pnpm/crypto.hash@1100.0.7'
  - '@pnpm/crypto.integrity@1100.0.8'
  - '@pnpm/deps.path@1101.0.5'
  - '@pnpm/error@1100.2.1'
  - '@pnpm/fetching.fetcher-base@1100.2.12'
  - '@pnpm/fs.graceful-fs@1100.2.4'
  - '@pnpm/hooks.types@1101.0.5'
  - '@pnpm/lockfile.fs@1100.2.10'
  - '@pnpm/lockfile.merger@1100.0.25'
  - '@pnpm/lockfile.types@1100.1.4'
  - '@pnpm/lockfile.utils@1102.1.5'
  - '@pnpm/network.git-utils@1100.0.6'
  - '@pnpm/patching.config@1100.1.8'
  - '@pnpm/resolving.resolver-base@1101.3.2'
  - '@pnpm/resolving.tarball-url@1101.1.3'
  - '@pnpm/store.cafs-types@1100.1.1'
  - cspell-config-lib@10.3.5
  - cspell-dictionary@10.3.5
  - cspell-gitignore@10.3.5
  - cspell-glob@10.3.5
  - cspell-grammar@10.3.5
  - cspell-io@10.3.5
  - cspell-lib@10.3.5
  - cspell-trie-lib@10.3.5
  - cspell@10.3.5
  - eslint-plugin-react-dom@5.21.1
  - eslint-plugin-react-jsx@5.21.1
  - eslint-plugin-react-naming-convention@5.21.1
  - eslint-plugin-react-rsc@5.21.1
  - eslint-plugin-react-web-api@5.21.1
  - eslint-plugin-react-x@5.21.1
allowBuilds:
  esbuild: true
  unrs-resolver: true
