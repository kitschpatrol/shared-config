packages:
  - packages/*
ignoreWorkspaceRootCheck: true
publicHoistPattern:
  - '@kitschpatrol/repo-config'
  - '@kitschpatrol/typescript-config'
  - 'case-police'
  - '*cspell*'
  - '*eslint*'
  - '*knip*'
  - '*mdat*'
  - '*prettier*'
  - '*remark*'
  - '*stylelint*'
overrides:
  normalize-package-data: ^9.0.0
peerDependencyRules:
  allowedVersions:
    # No eslint 10 release yet, but runtime-compatible (used via eslint-plugin-astro)
    'eslint-plugin-jsx-a11y>eslint': '10'
allowBuilds:
  esbuild: true
  oxc-resolver: true
  puppeteer: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@pnpm/crypto.integrity@1100.0.6'
  - '@pnpm/error@1100.1.4'
  - '@pnpm/hooks.types@1101.0.2'
  - '@pnpm/lockfile.fs@1100.2.6'
  - '@pnpm/lockfile.merger@1100.0.22'
  - '@pnpm/lockfile.types@1100.1.1'
  - '@pnpm/lockfile.utils@1102.1.1'
  - '@pnpm/resolving.tarball-url@1101.1.1'
  - '@typescript-eslint/eslint-plugin@8.70.0'
  - '@typescript-eslint/parser@8.70.0'
  - '@typescript-eslint/project-service@8.70.0'
  - '@typescript-eslint/scope-manager@8.70.0'
  - '@typescript-eslint/tsconfig-utils@8.70.0'
  - '@typescript-eslint/type-utils@8.70.0'
  - '@typescript-eslint/types@8.70.0'
  - '@typescript-eslint/typescript-estree@8.70.0'
  - '@typescript-eslint/utils@8.70.0'
  - '@typescript-eslint/visitor-keys@8.70.0'
